server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        try_files $uri =404;

        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
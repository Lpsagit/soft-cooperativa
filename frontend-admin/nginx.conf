server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /cooperativa/admin_coop/ {
        rewrite ^/cooperativa/admin_coop/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        rewrite ^/cooperativa/admin_coop/(.*)$ /$1 break;
        try_files $uri =404;

        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }
}
